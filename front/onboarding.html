<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SayLess — Onboarding</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body class="page-onboard">
    <main class="content">
      <section class="onboard-card">
        <button
          class="icon-btn onboard-close"
          type="button"
          id="onboard-close"
          aria-label="Close"
        >
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <div class="onboard-col">
          <h1 class="onboard-title">Shape your <em>voice</em></h1>
          <p class="onboard-intro">
            Share the context you want every draft to carry: what you do, who
            you write for, and how you like to sound
          </p>
          <label class="field-label" for="context">Your context</label>
          <textarea
            class="textarea onboard-input"
            id="context"
            placeholder="I write about design systems for early stage teams, in a warm and direct voice"
          ></textarea>
          <button class="btn btn-primary onboard-cta" type="button" id="onboard-next">
            Continue
          </button>
          <p class="onboard-note">You can update this anytime in settings</p>
        </div>
      </section>
    </main>

    <div class="page-tail">
      <a class="corner-logo" href="generate.html">
        <img class="brand-logo" src="../public/sayless-logo.png" alt="SayLess" />
      </a>
    </div>
  </body>
</html>
