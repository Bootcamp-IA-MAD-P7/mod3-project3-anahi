[project]
name = "mod3-project3-anahi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "datetime>=6.0",
    "feedparser>=6.0.14",
    "groq<1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the real Groq API, opt-in via RUN_LIVE_LLM_TESTS=1",
    "integration: marks tests that hit real external services",
    "slow: marks tests that are slow due to network or model loading",
]

