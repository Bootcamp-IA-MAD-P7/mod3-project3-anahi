[project]
name = "mod3-project3-anahi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "datetime>=6.0",
    "groq<1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real Groq API, opt-in via RUN_LIVE_LLM_TESTS=1"]

