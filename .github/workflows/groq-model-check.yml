name: Groq model check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  live-model-check:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_LIVE_LLM_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/integration/ -m live
